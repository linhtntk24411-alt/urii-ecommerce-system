<div class="admin-login-layout">
  <!-- Header trước khi đăng nhập -->
  <header class="admin-auth-header">
    <div class="admin-auth-header-inner">
      <div class="header-brand">
        <a routerLink="/" class="brand-link" title="Trang chủ Admin">
          <img src="assets/Urii-Logo.png" alt="Urii Logo" class="brand-logo">
        </a>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="portal-badge">Hệ thống Quản trị</span>
      </div>

      <div class="header-actions">
        <a href="mailto:support@urii.com" class="header-link">
          <span class="material-symbols-outlined icon-sm" aria-hidden="true">help</span>
          <span>Hỗ trợ</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Khung nội dung đăng nhập -->
  <main class="auth-page">
    <input
      class="auth-mode"
      type="radio"
      name="auth-mode"
      id="login-mode"
      checked
    >
    <section class="auth-card" aria-label="Đăng nhập Urii Admin">

      <header class="auth-header auth-heading--login">
        <h1 class="auth-title">Chào mừng trở lại</h1>
        <p class="auth-subtitle">
          Vui lòng đăng nhập để tiếp tục quản trị hệ thống Urii.
        </p>
      </header>

      <form
        class="auth-panel login-panel"
        aria-label="Đăng nhập Admin"
        (submit)="$event.preventDefault(); login(emailInput.value, passwordInput.value)"
      >

        <div class="field-group">
          <label class="field-label" for="login-email">Email</label>
          <input
            #emailInput
            class="field-input"
            id="login-email"
            type="email"
            placeholder="admin@gmail.com"
            autocomplete="username"
            (keydown.enter)="login(emailInput.value, passwordInput.value)"
          >
        </div>

        <div class="field-group">
          <div class="field-heading">
            <label class="field-label" for="login-password">Mật khẩu</label>
            <span class="text-link">Quên mật khẩu?</span>
          </div>

          <div class="password-field">
            <input
              #passwordInput
              class="field-input"
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              autocomplete="current-password"
              (keydown.enter)="login(emailInput.value, passwordInput.value)"
            >
            <button
              type="button"
              class="password-icon-btn"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61M2 2l20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <button
          class="primary-button"
          type="submit"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Đang đăng nhập...' : 'Tiếp tục' }}
        </button>

        @if (loginError) {
          <p class="login-error">{{ loginError }}</p>
        }

        <div class="divider"><span>HOẶC</span></div>

        <div class="social-buttons">
          <button class="social-button" type="button" [disabled]="isLoading" (click)="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z"/>
              <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.7A10 10 0 0 0 12 22Z"/>
              <path fill="#FBBC05" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.4H3a10 10 0 0 0 0 9.2l3.4-2.7Z"/>
              <path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A9.7 9.7 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.7C7.2 7.8 9.4 6 12 6Z"/>
            </svg>
            Google
          </button>

          <button class="social-button" type="button">
            <svg class="facebook-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.3c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.3 2.7.3v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.6 3.5h-2.8v8.4A12 12 0 0 0 24 12Z"/>
            </svg>
            Facebook
          </button>
        </div>

        <p class="auth-help">
          Bạn gặp khó khăn? <span class="text-link">Trung tâm trợ giúp</span>
        </p>

      </form>
    </section>
  </main>

  <!-- Footer từ admin-layout -->
  <footer class="urii-footer">
    <div class="footer-bottom">
      <div class="footer-bottom-inner">
        © 2024 Urii Perler Beads. All rights reserved.
      </div>
    </div>
  </footer>
</div>
