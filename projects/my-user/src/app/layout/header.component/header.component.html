<header class="urii-header">
    <div class="header-container">
        <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- LOGO -->
        <div class="header-logo">
            <a routerLink="/">
                <img src="assets/Urii-Logo.png" alt="Urii Logo" class="logo-img" />
            </a>
        </div>

        <nav class="header-nav" [class.active]="isMobileMenuOpen">
            <!-- Nút X đóng menu trong sidebar -->
            <div class="mobile-nav-header">
                <button class="btn-close-mobile" (click)="closeMobileMenu()" aria-label="Close menu">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <ul class="nav-menu-list">
                <li><a routerLink="/" class="nav-link" (click)="closeMobileMenu()">Trang chủ</a></li>
                
                <li class="nav-dropdown" [class.mobile-open]="isMobileProductOpen">
                    <a class="nav-link nav-dropdown-toggle" (click)="toggleMobileProduct($event)">
                        Sản phẩm
                        <svg class="dropdown-arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </a>
                    
                    <ul class="dropdown-menu">
                        <li><a routerLink="/product" [queryParams]="{category: 'kit'}" (click)="closeMobileMenu()"><span class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path></svg></span>Bộ kit</a></li>
                        <li><a routerLink="/product" [queryParams]="{category: 'tool'}" (click)="closeMobileMenu()"><span class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></span>Dụng cụ</a></li>
                        <li><a routerLink="/product" [queryParams]="{category: 'bead'}" (click)="closeMobileMenu()"><span class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>Hạt lẻ</a></li>
                        <li><a routerLink="/product" [queryParams]="{category: 'accessory'}" (click)="closeMobileMenu()"><span class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg></span>Phụ kiện handmade</a></li>
                    </ul>
                </li>
                
                <li><a routerLink="/sample-maps" class="nav-link" (click)="closeMobileMenu()">Thư viện map mẫu</a></li>
                <li><a routerLink="/blog-list" class="nav-link" (click)="closeMobileMenu()">Blog cộng đồng</a></li>
            </ul>
        </nav>

        <div class="mobile-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

        <div class="header-actions">
            <!-- Search -->
            <div class="search-box">
                <button type="button" class="btn-search-icon">
                    <svg class="search-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
                    </svg>
                </button>
                <input type="text" placeholder="Tìm kiếm sản phẩm..." />
            </div>

            <a routerLink="/cart" class="action-item cart-icon-wrapper">
                <svg class="custom-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
            </a>

            <div class="header-divider"></div>

            <div class="auth-buttons" *ngIf="!isLoggedIn">
                <a routerLink="/register" class="btn-register">Đăng ký</a>
                <a routerLink="/login" class="btn-login">Đăng nhập</a>
            </div>

            <div class="action-item account-icon-wrapper" *ngIf="isLoggedIn">
                <div class="account-circle">
                    <img class="account-avatar" [src]="userAvatar" *ngIf="userAvatar" alt="Avatar" />
                    <svg class="account-svg" *ngIf="!userAvatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="account-dropdown">
                    <ul class="account-menu">
                        <li><a routerLink="/profile" class="account-menu-item">Hồ sơ của tôi</a></li>
                        <li><a routerLink="/orders" class="account-menu-item">Đơn hàng của tôi</a></li>
                        <li><a routerLink="/custom-order-list" class="account-menu-item">Yêu cầu thiết kế</a></li>
                        <li><a routerLink="/saved-maps" class="account-menu-item">Kho map đã lưu</a></li>
                        <li><a routerLink="/myreview" class="account-menu-item">Đánh giá của tôi</a></li>
                    </ul>
                    <div class="account-logout">
                        <button class="btn-logout" (click)="openLogoutModal()">Đăng xuất</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
